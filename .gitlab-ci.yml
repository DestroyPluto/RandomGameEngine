build-linux-job:
  image: 192.168.1.17:5050/destroypluto/practiceproject:linux
  stage: build
  script:
    - echo "Hello, $GITLAB_USER_LOGIN!"
    - cmake --fresh .
    - make
  artifacts:
    untracked: false
    when: on_success
    expire_in: 30 days
    paths:
      - "bin/*"

test-job1:
  stage: test
  script:
    - echo "This job tests something!"

deploy-prod:
  stage: deploy
  script:
    -  echo "This job deploys something from the $CI_COMMIT_BRANCH branch"
  environment: production
